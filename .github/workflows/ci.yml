name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate localisations
        run: flutter gen-l10n
      - name: Analyze
        # Errors and warnings gate the build; style infos (e.g. trailing commas,
        # which `dart format` maintains) are reported but non-fatal.
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate localisations
        run: flutter gen-l10n
      # No key.properties in CI, so android/app/build.gradle falls back to
      # debug signing — the APK is installable for sideload testing but not
      # for Play Store upload. Release mode still exercises R8/proguard.
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: robux-box-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  functions:
    name: Cloud Functions build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
