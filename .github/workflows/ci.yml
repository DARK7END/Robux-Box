name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.x"
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate localisations
        run: flutter gen-l10n
      - name: Analyze
        # Errors and warnings gate the build; style infos (e.g. trailing commas,
        # which `dart format` maintains) are reported but non-fatal.
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  build-android:
    name: Build Android APK
    # Manual only. This used to run on every push, publishing a new APK to the
    # GitHub release on each one — with pushes going to both the feature branch
    # and main, that silently piled up dozens of stale release assets. Trigger
    # this from the Actions tab (or ask for it) only when a sideload build is
    # actually needed.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.x"
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate localisations
        run: flutter gen-l10n
      # No key.properties in CI, so android/app/build.gradle falls back to
      # debug signing — the APK is installable for sideload testing but not
      # for Play Store upload. Release mode still exercises R8/proguard.
      - name: Build release APK
        run: flutter build apk --release
      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/robux-box-latest.apk
      # A single rolling "android-latest" release: delete it first (ignoring
      # "not found" on the very first run) and recreate it fresh, so exactly one
      # APK ever exists instead of accumulating a new asset on every run.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest dist/robux-box-latest.apk \
            --target "${{ github.sha }}" \
            --title "Robux Box (Android) — latest" \
            --notes "Automated build from ${{ github.sha }} on ${{ github.ref_name }}. Debug-signed APK for sideload testing only — not signed for Play Store upload." \
            --prerelease

  functions:
    name: Cloud Functions build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
