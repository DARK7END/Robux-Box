name: Deploy Firebase backend

on:
  # Manual only — this pushes live Firestore rules/indexes, Storage rules and
  # Cloud Functions straight to production. Trigger from the Actions tab (or
  # ask for it) when a backend change actually needs to go out.
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy rules, indexes, storage & functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install functions dependencies
        working-directory: functions
        run: npm ci
      - name: Lint & test functions
        working-directory: functions
        run: |
          npm run lint
          npm test
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Write deploy service account key
        # The key JSON is passed through `env` (not spliced straight into the
        # script via ${{ }}) because its double quotes would otherwise break
        # out of the echo string and mangle the file — GOOGLE_APPLICATION_
        # CREDENTIALS would then point at invalid JSON and every gcloud call
        # would fail auth with a generic "have you run firebase login?".
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$SERVICE_ACCOUNT_JSON" > "${{ runner.temp }}/gcp-key.json"
      - name: Deploy to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
        # --force: don't pause for interactive confirmation (e.g. when a
        # function is removed from source) — this is meant to run unattended.
        run: |
          firebase deploy \
            --project robux-box1 \
            --only firestore:rules,firestore:indexes,storage,functions \
            --non-interactive --force
      - name: Clean up credentials
        if: always()
        run: rm -f "${{ runner.temp }}/gcp-key.json"
