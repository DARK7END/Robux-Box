name: iOS unsigned IPA

# Builds an UNSIGNED .ipa for sideloading (iLoader / Sideloadly / AltStore).
# No Apple Developer account or secrets required — the sideloading tool re-signs
# with your free Apple ID. Trigger manually from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Build flavor (dev uses AdMob TEST ads)"
        required: true
        default: "dev"
        type: choice
        options: [dev, staging, prod]

jobs:
  build:
    name: Build unsigned IPA
    # macos-14's default Xcode predates Swift 6 (the `sending` keyword),
    # which recent Firebase iOS SDK pods (e.g. FirebaseSharedSwift) require to
    # even parse. macos-15 ships Xcode 16+ by default.
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.x"
          channel: stable
          cache: true

      - name: Select latest available Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Generate iOS project + overlay config
        run: bash tool/setup_ios.sh

      - name: Build unsigned .app
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=FLAVOR=${{ github.event.inputs.flavor }}

      - name: Package unsigned IPA
        run: bash tool/package_unsigned_ipa.sh

      - name: Rename IPA with build number
        run: |
          mkdir -p dist
          cp build/ios/ipa/RobuxBox-unsigned.ipa \
             "dist/RobuxBox-unsigned-${{ github.event.inputs.flavor }}-build${{ github.run_number }}.ipa"

      # Publishes to a single rolling "ios-latest" release (updated in place on
      # every manual run) instead of a workflow artifact — artifacts expire and
      # require a GitHub login to download; a release gives a stable,
      # directly-downloadable link for dropping into iLoader / Sideloadly / AltStore.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: "Robux Box (iOS, unsigned) — build ${{ github.run_number }}"
          body: |
            Automated unsigned .ipa build from `${{ github.sha }}` (flavor: `${{ github.event.inputs.flavor }}`).

            No Apple Developer account or code signing — sideload with iLoader, Sideloadly or AltStore using your free Apple ID.
          prerelease: true
          make_latest: true
          files: dist/RobuxBox-unsigned-${{ github.event.inputs.flavor }}-build${{ github.run_number }}.ipa
